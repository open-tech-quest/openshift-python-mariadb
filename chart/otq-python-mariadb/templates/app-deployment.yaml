apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otq.app.name" . }}
  labels:
    {{- include "otq.labels" . | nindent 4 }}
    {{- include "otq.app.selectorLabels" . | nindent 4 }}
    app.openshift.io/runtime: python
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "otq.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otq.app.selectorLabels" . | nindent 8 }}
      {{- if not .Values.database.existingSecret }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- include "otq.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: CHALLENGE_NAME
              value: {{ .Values.challenge.name | quote }}
            - name: DB_HOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "otq.secret.name" . }}
                  key: {{ include "otq.secret.passwordKey" . }}
            - name: DB_CONNECT_TIMEOUT
              value: {{ .Values.database.connectTimeout | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
