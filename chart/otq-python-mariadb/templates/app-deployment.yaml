apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otq.app.name" . }}
  labels:
    {{- include "otq.labels" . | nindent 4 }}
    {{- include "otq.app.selectorLabels" . | nindent 4 }}
    app.openshift.io/runtime: python
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"{{ include "otq.db.name" . }}"}]'
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "otq.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otq.app.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- include "otq.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: CHALLENGE_NAME
              value: {{ .Values.challenge.name | quote }}
            - name: DB_HOST
              value: {{ include "otq.db.name" . }}
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: DB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "otq.secret.name" . }}
                  key: database-password
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
