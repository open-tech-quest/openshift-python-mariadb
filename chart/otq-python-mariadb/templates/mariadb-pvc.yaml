{{- if .Values.mariadb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "otq.db.name" . }}
  labels:
    {{- include "otq.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.mariadb.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}
  {{- with .Values.mariadb.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
