apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otq.secret.name" . }}
  labels:
    {{- include "otq.labels" . | nindent 4 }}
type: Opaque
stringData:
  challenge-flag: {{ include "otq.secretValue" (dict "ctx" . "key" "challenge-flag" "value" .Values.challenge.flag "length" 16) | quote }}
  database-password: {{ include "otq.secretValue" (dict "ctx" . "key" "database-password" "value" .Values.mariadb.password "length" 24) | quote }}
  database-root-password: {{ include "otq.secretValue" (dict "ctx" . "key" "database-root-password" "value" .Values.mariadb.rootPassword "length" 24) | quote }}
