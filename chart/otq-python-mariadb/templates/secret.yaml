{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otq.secret.name" . }}
  labels:
    {{- include "otq.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ required "database.password or database.existingSecret is required" .Values.database.password | quote }}
{{- end }}
