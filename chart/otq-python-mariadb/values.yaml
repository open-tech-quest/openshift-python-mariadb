challenge:
  # Row in the `challenge` table the app displays
  name: openshift-python-mariadb
  # Leave empty to generate a random 16 character flag on first install.
  # The generated flag is kept across `helm upgrade` (read back from the Secret).
  flag: ""

app:
  image:
    repository: quay.io/open-tech-quest/openshift-python-mariadb-app
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

mariadb:
  image:
    repository: registry.access.redhat.com/hi/mariadb
    tag: latest
    pullPolicy: IfNotPresent
  database: otq
  user: otq
  # Leave empty to generate random passwords (kept across upgrades)
  password: ""
  rootPassword: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    # false = emptyDir: data (incl. flag) is re-seeded from the Secret on every pod restart
    enabled: true
    size: 1Gi
    # Empty = cluster default StorageClass
    storageClass: ""
    accessModes:
      - ReadWriteOnce

route:
  enabled: true
  # Empty = OpenShift generates <route>-<namespace>.<apps domain>
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
