challenge:
  # Row in the `challenge` table the app displays
  name: openshift-python-mariadb

# Connection to the (externally hosted) MariaDB database.
# For a quick demo database see demo-db-deployment/ in the repository root.
database:
  # Hostname or Service name of the MariaDB server (required)
  host: ""
  port: 3306
  name: otq
  user: otq
  # Password for `user`. Ignored when existingSecret is set.
  # The chart then creates a Secret <release>-otq-python-mariadb with key `database-password`.
  password: ""
  # Use an existing Secret instead of `password` (e.g. `otq-mariadb` from demo-db-deployment/)
  existingSecret: ""
  existingSecretPasswordKey: database-password
  connectTimeout: 3

app:
  image:
    repository: quay.io/open-tech-quest/openshift-python-mariadb-app
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

route:
  enabled: true
  # Empty = OpenShift generates <route>-<namespace>.<apps domain>
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
