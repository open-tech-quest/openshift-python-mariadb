apiVersion: apps/v1
kind: Deployment
metadata:
  name: otq-mariadb
  labels:
    app.openshift.io/runtime: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: registry.access.redhat.com/hi/mariadb:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: otq
            - name: MARIADB_USER
              value: otq
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otq-mariadb
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otq-mariadb
                  key: database-root-password
            - name: CHALLENGE_NAME
              valueFrom:
                secretKeyRef:
                  name: otq-mariadb
                  key: challenge-name
            - name: CHALLENGE_FLAG
              valueFrom:
                secretKeyRef:
                  name: otq-mariadb
                  key: challenge-flag
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MARIADB_PASSWORD" mariadb -h 127.0.0.1 -u "$MARIADB_USER" -D "$MARIADB_DATABASE" -e 'SELECT 1 FROM challenge LIMIT 1'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-admin -h 127.0.0.1 -u root ping
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otq-mariadb
        - name: initdb
          configMap:
            name: otq-mariadb-initdb
